[package]
name = "yetlet-vite-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }
