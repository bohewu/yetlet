[package]
name = "yetlet-signing"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
foreign-types = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde_json = "1"
