[package]
name = "yetlet-signing"
version = "0.9.0-alpha.3"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bohewu/yetlet"
description = "Experimental opt-in native signing with explicit key trust"

[workspace]

[dependencies]
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
foreign-types = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde_json = "1"
