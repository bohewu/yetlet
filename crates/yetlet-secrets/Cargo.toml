[workspace]
resolver = "3"

[package]
name = "yetlet-secrets"
version = "0.9.0-alpha.2"
edition = "2024"
rust-version = "1.99"
readme = "README.md"
repository = "https://github.com/bohewu/yetlet"
license = "MIT OR Apache-2.0"
description = "Experimental opt-in native string secret provider"

[dependencies]
secrecy = "=0.10.3"

[dev-dependencies]
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
yetlet-config = { version = "0.9.0-alpha.2", path = "../yetlet-config" }
yetlet-core = { version = "0.9.0-alpha.2", path = "../yetlet-core" }
yetlet-server-axum = { version = "0.9.0-alpha.2", path = "../yetlet-server-axum" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "process", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
