[package]
name = "yetlet-auth"
description = "Explicit opt-in native identity extraction for Yetlet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
session = ["dep:yetlet-session"]

[dependencies]
axum.workspace = true
yetlet-session = { version = "0.9.0-alpha.1", path = "../yetlet-session", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body = "1"
yetlet-core = { version = "0.9.0-alpha.1", path = "../yetlet-core" }
yetlet-server-axum = { version = "0.9.0-alpha.1", path = "../yetlet-server-axum" }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false }
