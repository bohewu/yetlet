[workspace]
resolver = "3"

[package]
name = "yetlet-wgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Experimental opt-in bounded flat rectangle renderer; no performance or stable API guarantee"

[features]
default = []
browser = ["dep:wgpu", "dep:wasm-bindgen", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "webgpu", "wgsl"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"], optional = true }
