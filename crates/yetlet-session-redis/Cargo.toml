[package]
name = "yetlet-session-redis"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental explicitly selected async Redis sessions for Yetlet"

# Remain outside the default workspace while single-primary qualification is open.
[workspace]
resolver = "3"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2.6"
yetlet-server-axum = { path = "../yetlet-server-axum" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["cookies"] }
