[package]
name = "yetlet-session-redis"
version = "0.9.0-alpha.1"
edition = "2024"
rust-version = "1.99"
readme = "README.md"
repository = "https://github.com/bohewu/yetlet"
license = "MIT OR Apache-2.0"
description = "Experimental explicitly selected async Redis sessions for Yetlet"

# Keep remote-provider dependencies in an independently selected workspace.
[workspace]
resolver = "3"

[features]
default = []
tls = ["redis/tokio-rustls-comp", "dep:rustls"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
axum = "=0.8.9"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2.6"
yetlet-server-axum = { version = "0.9.0-alpha.1", path = "../yetlet-server-axum" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["cookies"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(yetlet_session_admission_probe)'] }
