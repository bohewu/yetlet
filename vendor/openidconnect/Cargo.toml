# Application-owned OIDC dependency patch; see UPSTREAM.md.
[package]
edition = "2021"
rust-version = "1.99"
publish = false
name = "openidconnect"
version = "4.0.1"
authors = ["David A. Ramos <ramos@cs.stanford.edu>"]
description = "OpenID Connect library"
readme = "README.md"
keywords = [
    "openid",
    "oidc",
    "oauth2",
    "authentication",
    "auth",
]
license = "MIT"
repository = "https://github.com/ramosbugs/openidconnect-rs"

[package.metadata.docs.rs]
all-features = true

[dependencies.base64]
version = "0.21"

[dependencies.chrono]
version = "0.4"
features = [
    "clock",
    "std",
    "wasmbind",
]
default-features = false

[dependencies.dyn-clone]
version = "1.0.10"

[dependencies.ed25519-dalek]
version = "2.0.0"
features = ["pem"]

[dependencies.hmac]
version = "0.12.1"

[dependencies.http]
version = "1.0"

[dependencies.itertools]
version = "0.10"

[dependencies.log]
version = "0.4"

[dependencies.oauth2]
version = "5.0.0"
default-features = false

[dependencies.p256]
version = "0.14.0"

[dependencies.p384]
version = "0.14.0"

[dependencies.rand]
version = "0.8.5"

[dependencies.rsa]
version = "0.9.2"

[dependencies.serde]
version = "1.0"

[dependencies.serde-value]
version = "0.7"

[dependencies.serde_json]
version = "1.0"

[dependencies.serde_path_to_error]
version = "0.1"

[dependencies.serde_plain]
version = "1.0"

[dependencies.serde_with]
version = "3"

[dependencies.sha2]
version = "0.10.6"
features = ["oid"]

[dependencies.subtle]
version = "2.4"

[dependencies.thiserror]
version = "1.0"

[dependencies.url]
version = "2.4"
features = ["serde"]

[features]
accept-rfc3339-timestamps = []
accept-string-booleans = []
curl = ["oauth2/curl"]
default = [
    "reqwest",
    "rustls-tls",
]
native-tls = ["oauth2/native-tls"]
reqwest = ["oauth2/reqwest"]
reqwest-blocking = ["oauth2/reqwest-blocking"]
rustls-tls = ["oauth2/rustls-tls"]
timing-resistant-secret-traits = ["oauth2/timing-resistant-secret-traits"]
ureq = ["oauth2/ureq"]

[badges.maintenance]
status = "actively-developed"
