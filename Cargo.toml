[workspace]
members = [
    "crates/yetlet-core",
    "crates/yetlet-reactive",
    "crates/yetlet-html",
    "crates/yetlet-dom",
    "crates/yetlet-dom-keyed",
    "crates/yetlet-actions",
    "crates/yetlet-server-axum",
    "crates/yetlet-request-id",
    "crates/yetlet-session",
    "examples/todo-ui",
    "examples/todo-browser",
    "examples/search-island",
    "examples/render-bench",
    "examples/keyed-bindings",
    "examples/rest-api",
    "examples/cart-server",
    "examples/hello-world",
    "examples/middleware-lab",
    "examples/forms-validation",
    "examples/file-server",
    "examples/sqlite-crud",
    "examples/todo-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
