[workspace]
members = [
    "crates/yetlet-core",
    "crates/yetlet-html",
    "crates/yetlet-dom",
    "crates/yetlet-server-axum",
    "examples/todo-ui",
    "examples/todo-browser",
    "examples/todo-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
