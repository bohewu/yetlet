[package]
name = "yetlet-todo-ui"
description = "Shared renderer-independent Yetlet Todo components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["actions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["html"] }
