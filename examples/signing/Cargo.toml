[package]
name = "yetlet-signing-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[dependencies]
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["signing"] }
tokio = { version = "1", features = ["macros", "rt"] }
