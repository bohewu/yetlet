[package]
name = "yetlet-batch-import"
description = "Resume a batch CSV import from its SQLite checkpoint after worker interruption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
tempfile = "3"
yetlet = { path = "../../crates/yetlet", version = "1.0.0-rc.1", default-features = false }
