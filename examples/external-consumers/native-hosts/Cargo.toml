[package]
name = "yetlet-native-hosts-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Independent caller-driven Native, UDP and optional Web Host consumer"

# Resolve normal dependencies independently of the SDK's development dependencies.
[workspace]

[features]
default = []
native = ["yetlet/native-winit", "yetlet/udp"]
web = ["yetlet/web"]

[dependencies]
yetlet = { version = "1.0.0-rc.1", path = "../../../crates/yetlet", default-features = false }

[[bin]]
name = "yetlet-native-hosts-consumer"
path = "src/main.rs"
required-features = ["native"]
