[package]
name = "browser-tasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[lib]
name = "tasks"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["reactive"] }
yetlet-browser = { path = "../../crates/yetlet-browser", version = "0.9.0-alpha.5", default-features = false, features = ["dom", "dom-keyed"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "Node", "Window"] }
