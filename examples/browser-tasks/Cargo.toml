[package]
name = "browser-tasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[lib]
name = "tasks"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-dom = { path = "../../crates/yetlet-dom" }
yetlet-dom-keyed = { path = "../../crates/yetlet-dom-keyed" }
yetlet-reactive = { path = "../../crates/yetlet-reactive" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "Node", "Window"] }
