[package]
name = "yetlet-style-showcase"
description = "Native-first gallery of app-owned Rust Views and styles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "yetlet-style-showcase"

[dependencies]
yetlet = { version = "0.9.0-alpha.8", path = "../../crates/yetlet", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
yetlet = { version = "0.9.0-alpha.8", path = "../../crates/yetlet", default-features = false, features = ["server-axum"] }
axum.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
