[package]
name = "yetlet-todo-browser"
description = "Yetlet browser-only Rust/WASM Todo demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yetlet-dom = { path = "../../crates/yetlet-dom" }
yetlet-dom-keyed = { path = "../../crates/yetlet-dom-keyed" }
yetlet-reactive = { path = "../../crates/yetlet-reactive" }
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-todo-ui = { path = "../todo-ui" }
yetlet-actions = { path = "../../crates/yetlet-actions" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlInputElement",
    "Node",
    "Text",
    "Window",
] }
