[package]
name = "yetlet-hello-world"
description = "Minimal native Yetlet SSR sample without optional providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio.workspace = true
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
