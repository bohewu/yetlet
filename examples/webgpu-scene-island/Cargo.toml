[workspace]

[package]
name = "yetlet-webgpu-scene-island"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
