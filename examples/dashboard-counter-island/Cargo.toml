[package]
name = "yetlet-dashboard-counter-island"
description = "Independent counter WASM island for the multi-island dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "Event", "EventTarget"] }
