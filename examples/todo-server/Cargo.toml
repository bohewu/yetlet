[package]
name = "yetlet-todo-server"
description = "Minimal Yetlet native SSR proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["fs"] }
serde_json = "1"
serde = "1"
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["actions", "request-id", "server-axum"] }
tower-http = { version = "0.6", features = ["fs"] }
yetlet-todo-ui = { path = "../todo-ui" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
