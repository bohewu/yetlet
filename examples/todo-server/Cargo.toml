[package]
name = "yetlet-todo-server"
description = "Minimal Yetlet native SSR proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["fs"] }
serde_json = "1"
serde = "1"
yetlet-actions = { path = "../../crates/yetlet-actions" }
tower-http = { version = "0.6", features = ["fs"] }
yetlet-todo-ui = { path = "../todo-ui" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }
yetlet-request-id = { path = "../../crates/yetlet-request-id" }
yetlet-core = { path = "../../crates/yetlet-core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
