schema_version = 1

[[sample]]
id = "hello-world"
title = "Hello World Native SSR"
package = "yetlet-hello-world"
path = "examples/hello-world"
kind = "server-rendered"
status = "verified"
command = "cargo run -p yetlet-hello-world"
companion_packages = []
routes = [
  { path = "/", source = "examples/hello-world/src/lib.rs", markers = ['.page("/", "Yetlet Hello", home)'] },
  { path = "/hello/{name}", source = "examples/hello-world/src/lib.rs", markers = ['.get("/hello/{name}", hello)'] },
]
browser_runtime = false
browser_packages = []
browser_build = ""
optional_dependencies = []
evidence = "docs/M9A-VERIFICATION.md"

[[sample]]
id = "todo"
title = "Todo SSR and Browser"
package = "yetlet-todo-server"
path = "examples/todo-server"
kind = "full-stack"
status = "verified"
command = "cargo xtask build browser && cargo run -p yetlet-todo-server"
companion_packages = ["yetlet-todo-browser", "yetlet-search-island"]
routes = [
  { path = "/", source = "examples/todo-server/src/lib.rs", markers = ['.get("/", root)'] },
  { path = "/app", source = "examples/todo-server/src/lib.rs", markers = ['.get("/app", browser_shell)'] },
  { path = "/search", source = "examples/todo-server/src/lib.rs", markers = ['.get("/search", search_route)'] },
  { path = "/api/todos", source = "examples/todo-server/src/lib.rs", markers = ['.group("/api"', '"/todos"'] },
]
