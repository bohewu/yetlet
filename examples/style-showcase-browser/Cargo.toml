[package]
name = "yetlet-style-showcase-browser"
description = "Explicit class-only WASM enhancement for the Style Showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
yetlet-style-showcase = { path = "../style-showcase" }
yetlet-browser = { version = "0.9.0-alpha.7", path = "../../crates/yetlet-browser", default-features = false, features = ["dom-keyed"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "NodeList", "MouseEvent", "Event", "EventTarget"] }
