[package]
name = "yetlet-rest-api"
description = "API-only Yetlet typed REST sample"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }
yetlet-request-id = { path = "../../crates/yetlet-request-id" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
