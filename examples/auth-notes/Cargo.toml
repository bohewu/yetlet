[package]
name = "yetlet-auth-notes"
description = "Loopback-only synthetic authentication and per-user SSR notes sample"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
subtle = "2"
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum", "session"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
