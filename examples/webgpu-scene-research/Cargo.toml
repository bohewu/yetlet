[package]
name = "yetlet-webgpu-scene-research"
description = "Independent native wgpu scene research, not a Yetlet DOM renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "=27.0.1", optional = true, default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }

[[bin]]
name = "scene-bench"
path = "src/bin/scene-bench.rs"
required-features = ["gpu"]
