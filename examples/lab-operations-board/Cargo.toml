[package]
name = "yetlet-lab-operations-board"
description = "SSR-first local lab work records with authorization and transactional history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
request-tracing = ["dep:tracing", "yetlet/request-id"]
commit-write-auth = []
oidc = ["dep:openidconnect"]
valkey = ["yetlet/session-redis"]
auth-valkey = ["valkey", "yetlet/auth", "dep:libc", "tokio/fs", "tokio/io-util"]

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["actions", "server-axum", "session"] }
axum.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
futures-util = "0.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
getrandom = "0.3"
subtle = "2"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"], optional = true }
libc = { version = "0.2", optional = true }

yetlet-board-triage = { path = "../board-triage" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
