[package]
name = "yetlet-lab-operations-board"
description = "SSR-first local lab work records with authorization and transactional history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
oidc = ["dep:openidconnect"]
valkey = ["dep:yetlet-session-valkey"]

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
futures-util = "0.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
getrandom = "0.3"
subtle = "2"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"], optional = true }
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }
yetlet-session = { path = "../../crates/yetlet-session" }
yetlet-session-valkey = { package = "yetlet-session-redis", path = "../../crates/yetlet-session-redis", optional = true }

yetlet-board-triage = { path = "../board-triage" }
yetlet-actions = { path = "../../crates/yetlet-actions" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
