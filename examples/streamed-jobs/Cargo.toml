[package]
name = "yetlet-streamed-jobs"
description = "Stream a file between two loopback services and recover job progress over SSE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
futures-util = "0.3"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
yetlet = { path = "../../crates/yetlet", version = "1.0.0-rc.1", default-features = false, features = ["web"] }
