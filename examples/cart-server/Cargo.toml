[package]
name = "yetlet-cart-server"
description = "SSR shopping cart with explicit Yetlet sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum", "session"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
