[package]
name = "yetlet-form-css-proof"
description = "Isolated M11 native form and same-origin CSS integration proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
