[package]
name = "yetlet-form-css-proof"
description = "Isolated M11 native form and same-origin CSS integration proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
