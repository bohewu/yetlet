[package]
name = "yetlet-admin-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "SSR-first administration reference using the existing Lab Operations Board"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[features]
request-tracing = ["yetlet-lab-operations-board/request-tracing", "dep:tracing-subscriber"]
commit-write-auth = ["yetlet-lab-operations-board/commit-write-auth"]
valkey = ["yetlet-lab-operations-board/valkey"]
auth-valkey = ["valkey", "yetlet-lab-operations-board/auth-valkey"]

[dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"], optional = true }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
yetlet-config = { path = "../../crates/yetlet-config" }
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }
yetlet-lab-operations-board = { path = "../lab-operations-board", features = ["oidc"] }
yetlet-secrets = { path = "../../crates/yetlet-secrets" }
secrecy = { version = "=0.10.3", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"

[patch.crates-io]
# Admin is an independent workspace and must select the same application patch.
openidconnect = { path = "../../vendor/openidconnect" }
