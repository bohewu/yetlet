[server]
host = "127.0.0.1"
port = 3014

[database]
path = "data/board.sqlite3"

[session]
backend = "memory"

[session.valkey]
endpoint = ""
namespace = "admin_dashboard"
ttl_seconds = 1800

[auth]
enabled = false
policy_file = ""

[oidc]
enabled = false
application_origin = ""
issuer = ""
client_id = ""
client_secret = ""

[oidc.subjects]
alice = ""
bob = ""
viewer = ""

[cli.rust]
watch = false

[cli.vite]
enabled = true
root = "frontend/"
auto_start = false
auto_build = true

[cli.generate.k8s]
replicas = 1

# Explicitly selected app-owned schema-v2 reference; requires commit-write-auth.
[write_authorization]
enabled = false

# Application-owned safe request/worker diagnostics; requires request-tracing.
[request_tracing]
enabled = false
