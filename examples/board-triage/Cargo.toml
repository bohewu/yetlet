[package]
name = "yetlet-board-triage"
description = "Application-owned Rust/WASM triage state and browser workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yetlet-actions = { path = "../../crates/yetlet-actions" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-reactive = { path = "../../crates/yetlet-reactive" }
yetlet-dom-keyed = { path = "../../crates/yetlet-dom-keyed" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlCollection", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlButtonElement", "Node", "Window"] }
