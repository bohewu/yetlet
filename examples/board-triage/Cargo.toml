[package]
name = "yetlet-board-triage"
description = "Application-owned Rust/WASM triage state and browser workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["actions"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["reactive"] }
yetlet-browser = { path = "../../crates/yetlet-browser", version = "0.9.0-alpha.5", default-features = false, features = ["actions", "dom-keyed"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlCollection", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlButtonElement", "Node", "Window", "Request", "RequestInit", "Response", "Headers"] }
