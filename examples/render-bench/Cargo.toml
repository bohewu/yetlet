[package]
name = "yetlet-render-bench"
description = "Isolated M7a render strategy benchmark; not a public runtime API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-dom = { path = "../../crates/yetlet-dom" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "NodeList",
    "Performance",
    "Text",
    "Window",
] }
