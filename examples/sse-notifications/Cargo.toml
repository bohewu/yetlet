[package]
name = "yetlet-sse-notifications"
description = "Bounded native SSE notifications with replay and disconnect cleanup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["sync", "time", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
