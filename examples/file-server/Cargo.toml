[package]
name = "yetlet-file-server"
description = "Bounded native file upload and streaming download sample"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3"
getrandom = "0.4"
subtle = "2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
yetlet-core = { path = "../../crates/yetlet-core" }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
