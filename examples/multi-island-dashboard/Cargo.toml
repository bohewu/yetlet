[package]
name = "yetlet-multi-island-dashboard"
description = "SSR-first dashboard with two independently owned optional WASM islands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
