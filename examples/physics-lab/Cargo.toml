[workspace]
resolver = "3"

[package]
name = "yetlet-physics-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
default-run = "yetlet-physics-lab"
description = "Isolated application-owned opt-in 3D physics laboratory"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
browser = ["dep:rapier3d", "dep:wgpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
rapier3d = { version = "=0.36.1", default-features = false, features = ["std", "dim3", "f32"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["server-axum"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "webgpu", "wgsl"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }
