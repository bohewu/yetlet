[package]
name = "yetlet-middleware-lab"
description = "Runnable native Axum/Tower middleware and RequestContext lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
tokio.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
futures-util = "0.3"
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body = "1"
