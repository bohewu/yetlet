[package]
name = "yetlet-keyed-bindings"
description = "Isolated M7b/M7c/M7d keyed authoring, reactivity, and lifecycle prototype; not a stable runtime API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "render-ssr"
path = "src/bin/render_ssr.rs"

[dependencies]
yetlet = { path = "../../crates/yetlet", version = "0.9.0-alpha.5", default-features = false, features = ["html", "reactive"] }
yetlet-browser = { path = "../../crates/yetlet-browser", version = "0.9.0-alpha.5", default-features = false, features = ["dom-keyed"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "Event",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Text",
    "Window",
] }
