name: Yetlet documentation

on:
  pull_request:
    paths:
      - README.md
      - docs/FIRST-APP.md
      - docs/VIEW-COMPONENTS.md
      - docs/OPT-IN-QUICK-REFERENCE.md
      - docs/API-REFERENCE.md
      - docs/TROUBLESHOOTING.md
      - docs/*-HOSTED-RECORD.md
      - crates/yetlet/guides/server-axum.md
      - crates/yetlet-browser/guides/dom.md
      - examples/docs-site/**
      - site/pages.toml
      - scripts/release_version_authority.py
      - tools/build_docs.py
      - tools/build_yetlet_docs.py
      - tools/test_build_yetlet_docs.py
      - Cargo.toml
      - tools/yetlet-cli/**
      - .github/workflows/docs.yml
  push:
    branches: [master]
    paths:
      - README.md
      - docs/FIRST-APP.md
      - docs/VIEW-COMPONENTS.md
      - docs/OPT-IN-QUICK-REFERENCE.md
      - docs/API-REFERENCE.md
      - docs/TROUBLESHOOTING.md
      - docs/*-HOSTED-RECORD.md
      - crates/yetlet/guides/server-axum.md
      - crates/yetlet-browser/guides/dom.md
      - examples/docs-site/**
      - site/pages.toml
      - scripts/release_version_authority.py
      - tools/build_docs.py
      - tools/build_yetlet_docs.py
      - tools/test_build_yetlet_docs.py
      - Cargo.toml
      - tools/yetlet-cli/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select deployment eligibility
        id: mode
        env:
          DEPLOY_ENABLED: ${{ vars.PAGES_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Manual documentation publication requires master" >&2
            exit 1
          fi
          deploy=false
          if [[ "$GITHUB_REF" == refs/heads/master && "$DEPLOY_ENABLED" == true ]] &&
             [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Prepare the pinned toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
          echo "WASM_BINDGEN=$RUNNER_TEMP/guide-tools/bin/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Cache the pinned Wasm generator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/guide-tools
          key: yetlet-guide-bindgen-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-v0.2.129
      - name: Prepare locked dependencies and source CLI
        run: |
          set -euo pipefail
          if [[ ! -x "$WASM_BINDGEN" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked --root "$RUNNER_TEMP/guide-tools"
          fi
          [[ "$("$WASM_BINDGEN" --version)" == 'wasm-bindgen 0.2.129' ]]
          cargo fetch --locked --manifest-path examples/docs-site/Cargo.toml
          cargo fetch --locked --manifest-path tools/yetlet-cli/Cargo.toml
          cargo build --frozen --manifest-path tools/yetlet-cli/Cargo.toml --bin yetlet
      - name: Check the changed workflow wiring
        run: PYTHONPATH=tools python3 -m unittest test_build_yetlet_docs.PagesWorkflow
      - name: Build the clean, edition-bound guide artifact
        run: |
          set -euo pipefail
          python3 tools/build_yetlet_docs.py --public \
            --cli tools/yetlet-cli/target/debug/yetlet \
            --output "$RUNNER_TEMP/yetlet-guide/public/yetlet"
          cat "$RUNNER_TEMP/yetlet-guide/public/EXPORT-MANIFEST.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only the generated site root
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/yetlet-guide/public/yetlet
          name: github-pages
          include-hidden-files: true
          retention-days: 7
      - name: Retain source and export receipts separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yetlet-guide-build-record
          path: |
            ${{ runner.temp }}/yetlet-guide/public/EXPORT-MANIFEST.json
            ${{ runner.temp }}/yetlet-guide/public/STATIC-RECEIPTS/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy documentation
    needs: build
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PAGES_DEPLOY_ENABLED == 'true' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: yetlet-docs-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: 'false'
      - name: Check the accepted project URL
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          [[ "$PAGES_ORIGIN" == https://bohewu.github.io && "$PAGES_BASE_PATH" == /yetlet ]]
      - name: Deploy this run's Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
