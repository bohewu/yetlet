name: Yetlet private source-package rebuild

# Manual preparation only. This workflow does not sign or publish artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yetlet-private-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: Private source-package rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_BUILD_JOBS: '4'
    steps:
      - name: Checkout immutable workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build nine source packages from fresh inputs
        env:
          BUILD_WORKFLOW_REF: ${{ github.workflow_ref }}
          BUILD_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/yt086-xtask-bootstrap" cargo run --locked --manifest-path xtask/Cargo.toml -- release private-rebuild
      - name: Retain private package and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/private-rebuild/
          if-no-files-found: error
          retention-days: 7
