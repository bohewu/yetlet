name: Yetlet CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '31 5 * * 2'
  workflow_dispatch:

# Supersede outdated CodeQL runs for the same PR only. A unique run ID
# for non-PR events also prevents GitHub from discarding queued master,
# scheduled, or manually requested scans.
concurrency:
  group: yetlet-codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  scope:
    name: CodeQL change scope
    if: vars.CODEQL_ADVANCED_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.scope.outputs.languages }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test conservative language input selection
        run: python3 .github/scripts/test_codeql_scope.py
      - name: Identify complete language inputs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/codeql_scope.py

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: scope
    if: needs.scope.outputs.languages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.languages || '["actions","javascript-typescript","python","rust"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
