name: Yetlet guide preview

on:
  pull_request:
    paths:
      - README.md
      - docs/FIRST-APP.md
      - docs/VIEW-COMPONENTS.md
      - docs/OPT-IN-QUICK-REFERENCE.md
      - docs/API-REFERENCE.md
      - docs/TROUBLESHOOTING.md
      - crates/yetlet/guides/server-axum.md
      - crates/yetlet-browser/guides/dom.md
      - examples/docs-site/**
      - site/pages.toml
      - tools/build_docs.py
      - tools/build_yetlet_docs.py
      - tools/test_build_yetlet_docs.py
      - tools/yetlet-cli/**
      - Cargo.toml
      - .github/workflows/docs-preview.yml
  push:
    branches: [master]
    paths:
      - README.md
      - docs/FIRST-APP.md
      - docs/VIEW-COMPONENTS.md
      - docs/OPT-IN-QUICK-REFERENCE.md
      - docs/API-REFERENCE.md
      - docs/TROUBLESHOOTING.md
      - crates/yetlet/guides/server-axum.md
      - crates/yetlet-browser/guides/dom.md
      - examples/docs-site/**
      - site/pages.toml
      - tools/build_docs.py
      - tools/build_yetlet_docs.py
      - tools/test_build_yetlet_docs.py
      - tools/yetlet-cli/**
      - Cargo.toml
      - .github/workflows/docs-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yetlet-guide-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Yetlet guide artifact (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the pinned toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
          echo "WASM_BINDGEN=$RUNNER_TEMP/guide-tools/bin/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Cache the pinned Wasm generator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/guide-tools
          key: yetlet-guide-bindgen-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-v0.2.129
      - name: Prepare locked dependencies and source CLI
        run: |
          set -euo pipefail
          if [[ ! -x "$WASM_BINDGEN" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked --root "$RUNNER_TEMP/guide-tools"
          fi
          [[ "$("$WASM_BINDGEN" --version)" == 'wasm-bindgen 0.2.129' ]]
          cargo fetch --locked --manifest-path examples/docs-site/Cargo.toml
          cargo fetch --locked --manifest-path tools/yetlet-cli/Cargo.toml
          cargo build --frozen --manifest-path tools/yetlet-cli/Cargo.toml --bin yetlet
      - name: Check only the new publication boundaries
        run: PYTHONPATH=tools python3 -m unittest test_build_yetlet_docs
      - name: Build the clean, edition-bound guide artifact
        run: |
          set -euo pipefail
          python3 tools/build_yetlet_docs.py --public \
            --cli tools/yetlet-cli/target/debug/yetlet \
            --output "$RUNNER_TEMP/yetlet-guide/public/yetlet"
          cat "$RUNNER_TEMP/yetlet-guide/public/EXPORT-MANIFEST.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the selected site files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yetlet-guide-preview
          path: ${{ runner.temp }}/yetlet-guide/public/yetlet
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain source and export receipts separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yetlet-guide-build-record
          path: |
            ${{ runner.temp }}/yetlet-guide/public/EXPORT-MANIFEST.json
            ${{ runner.temp }}/yetlet-guide/public/STATIC-RECEIPTS/
          if-no-files-found: ignore
          retention-days: 7
