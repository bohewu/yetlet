worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile off;

    upstream yetlet_pool {
        server app-a:3010 max_fails=1 fail_timeout=1s;
        server app-b:3010 max_fails=1 fail_timeout=1s;
        server app-c:3010 max_fails=1 fail_timeout=1s;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;

        location / {
            proxy_pass http://yetlet_pool;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            add_header X-Yetlet-Upstream $upstream_addr always;
        }

        location ^~ /__yt066a/a/ {
            proxy_pass http://app-a:3010/;
            proxy_next_upstream off;
            add_header X-Yetlet-Upstream app-a always;
        }

        location ^~ /__yt066a/b/ {
            proxy_pass http://app-b:3010/;
            proxy_next_upstream off;
            add_header X-Yetlet-Upstream app-b always;
        }

        location ^~ /__yt066a/c/ {
            proxy_pass http://app-c:3010/;
            proxy_next_upstream off;
            add_header X-Yetlet-Upstream app-c always;
        }
    }
}
