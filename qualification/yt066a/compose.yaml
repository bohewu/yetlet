x-yetlet-app: &yetlet-app
  image: "${YT066A_APP_IMAGE:?set YT066A_APP_IMAGE}"
  environment:
    YETLET_AUTH_LISTEN: "0.0.0.0:3010"
    YETLET_AUTH_ISOLATED_CONTAINER_LAB: "1"
    YETLET_AUTH_ALICE_CODE: "${YT066A_ALICE_CODE:?set YT066A_ALICE_CODE}"
    YETLET_AUTH_BOB_CODE: "${YT066A_BOB_CODE:?set YT066A_BOB_CODE}"
  expose:
    - "3010"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  mem_limit: 192m
  cpus: 0.50
  stop_signal: SIGINT
  stop_grace_period: 5s
  restart: "no"
  networks:
    - lab

services:
  app-a:
    <<: *yetlet-app
  app-b:
    <<: *yetlet-app
  app-c:
    <<: *yetlet-app

  proxy:
    image: "nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94"
    entrypoint: ["/usr/sbin/nginx", "-g", "daemon off;"]
    depends_on:
      - app-a
      - app-b
      - app-c
    ports:
      - "127.0.0.1:${YT066A_HOST_PORT:?set YT066A_HOST_PORT}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.50
    restart: "no"
    networks:
      - front
      - lab

networks:
  front: {}
  lab:
    internal: true
