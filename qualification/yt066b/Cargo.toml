[package]
name = "yt066b-redis-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

# A private experiment, deliberately outside the framework dependency graph.
[workspace]
resolver = "3"

[dependencies]
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "0.2"
sha2 = "0.10"

[dev-dependencies]
axum = "=0.8.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["cookies"] }
