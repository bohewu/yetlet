[package]
name = "yetlet-redis-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
yetlet-server-axum = { path = "../../crates/yetlet-server-axum" }
yetlet-session-redis = { path = "../../crates/yetlet-session-redis" }
