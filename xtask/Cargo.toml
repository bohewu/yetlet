[package]
name = "yetlet-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
serde = "=1.0.229"
toml = "=0.8.19"
sha2 = "=0.10.9"
regex = "=1.12.3"
tempfile = "=3.27.0"
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
xml-rs = "=0.8.19"
sha1 = "=0.10.6"
getrandom = "=0.4.3"
flate2 = "=1.1.10"
tiny_http = "=0.12.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console"] }
